[package]
name = "kuda-sandbox-daemon"
version = "0.1.0"
edition = "2021"
description = "Standalone CLI and Unix Domain Socket Daemon for kuda-sandbox"
license = "MIT OR Apache-2.0"

[dependencies]
kuda-sandbox-core = { path = "../kuda-sandbox-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
